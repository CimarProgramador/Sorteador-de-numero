<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./styles.css">
    <title>Sorteador de Números</title>

</head>

<body>
    <main class="container-sorteador">
        <img id="logo" src="./assets/Logo 1.png" alt="Logo do Sorteador de Números" width="200">
        <p id="paragraph-main">Sortear um número entre:</p>
        <div id="input-container">
            <input type="number" id="input-min" placeholder="Mínimo">
            <p id="and">e</p>
            <input type="number" id="input-max" placeholder="Máximo">
        </div>
        <button id="btn-sortear">Sortear</button>
        <p id="resultado"></p>
    </main>
    


    <footer>
        <p>EmDev Desenvolvedor</p>
    </footer>

</body>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="./script.js"></script>

</html>
